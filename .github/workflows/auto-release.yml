name: Auto Release

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours — catches unreleased commits if a push event was missed.
    - cron: '0 */6 * * *'

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Check if HEAD needs a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TAG=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          if [ -n "$CURRENT_TAG" ]; then
            if gh release view "$CURRENT_TAG" > /dev/null 2>&1; then
              echo "new_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "new_release=true" >> "$GITHUB_OUTPUT"
              echo "new_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
            fi
          else
            LATEST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo 'v0.0.0')
            MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.check.outputs.new_release == 'true'
        run: |
          NEW_TAG="${{ steps.check.outputs.new_tag }}"
          if git tag --list "$NEW_TAG" | grep -q .; then
            echo "Tag $NEW_TAG already exists, skipping push"
          else
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
          fi

      - name: Build binaries
        if: steps.check.outputs.new_release == 'true'
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -trimpath -o dist/korphan-linux-amd64   .
          GOOS=linux   GOARCH=arm64 go build -trimpath -o dist/korphan-linux-arm64   .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -o dist/korphan-darwin-amd64  .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o dist/korphan-darwin-arm64  .
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/korphan-windows-amd64.exe .

      - name: Generate checksums
        if: steps.check.outputs.new_release == 'true'
        run: sha256sum dist/* > dist/checksums.txt

      - name: Create GitHub Release
        if: steps.check.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.check.outputs.new_tag }}" \
            --title "${{ steps.check.outputs.new_tag }}" \
            --generate-notes \
            dist/*

      - name: Log in to ghcr.io
        if: steps.check.outputs.new_release == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push container image
        if: steps.check.outputs.new_release == 'true'
        run: |
          IMG="ghcr.io/${{ github.repository }}"
          TAG="${{ steps.check.outputs.new_tag }}"
          docker build -t "$IMG:$TAG" -t "$IMG:latest" .
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"
