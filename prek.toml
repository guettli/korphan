# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" }
]

# Block commits that contain secrets. betterleaks is pinned in mise.toml.
[[repos]]
repo = "local"
hooks = [
  {
    id = "betterleaks",
    name = "betterleaks (secrets)",
    entry = "mise exec betterleaks -- betterleaks git --pre-commit --staged --redact --verbose",
    language = "system",
    pass_filenames = false
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "go-test",
    name = "Go tests",
    language = "system",
    entry = "go test ./...",
    pass_filenames = false,
    always_run = true
  },
  {
    id = "go-lint",
    name = "Go lint",
    language = "system",
    entry = "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run",
    pass_filenames = false,
    always_run = true
  },
  {
    id = "update-readme-usage",
    name = "Update README usage block",
    language = "script",
    entry = "scripts/update-readme.sh",
    pass_filenames = false,
    always_run = true
  }
]
